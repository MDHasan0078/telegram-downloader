# requirements-flet.lock — the Flet/Flutter toolchain, pinned and hashed.
#
# scripts/build-apk.sh and scripts/build-dmg.sh install Flet with
# `--require-hashes -r requirements-flet.lock`. Before this existed, those
# steps ran `pip install flet[all]==0.86.5`, which pins only the top-level
# name: the 50 distributions underneath it (uvloop, pydantic-core, websockets,
# keyring-free cookiecutter, ...) resolved to whatever was newest that minute,
# from any index, without a hash. Flet then drives Flutter and the Android
# SDK, so its whole dependency tree is in the build's trust boundary.
#
# One lock covers all three build jobs: the resolution below was produced
# independently for linux x86_64 (manylinux2014) and macOS arm64
# (macosx_11_0) at CPython 3.12 and returned the identical name==version set,
# so only the platform-specific artifact differs, and both sets of sha256s are
# listed. `--only-binary :all:` keeps the toolchain from compiling anything.
#
# This lock is for CPython 3.12, which is what build.yml pins via
# actions/setup-python. It deliberately carries no hashes for 3.13/3.14 wheels:
# running a release build on an unpinned interpreter must fail closed with a
# hash error rather than quietly install an artifact nobody recorded. The
# build scripts check the interpreter up front and say so in plain English.
#
# Regenerate (needs network), then confirm both platforms agree:
#   for plat in manylinux2014_x86_64 macosx_11_0_arm64; do
#     pip download --only-binary :all: --dest "/tmp/fl-$plat" \
#       --python-version 3.12 --implementation cp --abi cp312 \
#       --platform "$plat" 'flet[all]==0.86.5'
#   done
#   diff <(ls /tmp/fl-manylinux2014_x86_64 | sed 's/-[^-]*$//' | sort) \
#        <(ls /tmp/fl-macosx_11_0_arm64   | sed 's/-[^-]*$//' | sort)
#
# NB: this toolchain is build-time only. It is deliberately NOT what the .deb
# installs at runtime; that closure is requirements-runtime.lock.
#
# flet itself is requested with its extra so the whole closure above
# is pulled in from these exact artifacts.
