name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: >-
          Sign artifacts with the release keys, but only for the platforms whose
          secrets are configured (Ed25519 for the checksum manifests, Developer ID for
          the .dmg, upload keystore for the .apk). Skipped silently when the
          secret is absent so forks build unsigned.
        type: boolean
        default: true
      notarize:
        description: >-
          Additionally submit the .dmg to Apple's notary service and staple the
          ticket. Requires APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
          APPLE_TEAM_ID in addition to the Developer ID certificate.
        type: boolean
        default: true

# One release pipeline at a time, across ALL tags: a retagged/force-pushed v*
# must not race the previous run's artifact rename + release attach. The old
# `build-${{ github.ref }}` group gave every tag its own lane, so v1.3.0 and
# v1.3.1 published concurrently and clobbered each other's assets — the exact
# race the comment here claims to prevent.
#
# cancel-in-progress is deliberately FALSE. Cancelling mid-publish is how you
# end up with a release that has the .deb attached but no checksum manifest (or
# vice versa). Runs queue instead; the publish step is also idempotent.
concurrency:
  group: build-release
  cancel-in-progress: false

# Least privilege: builds only READ; only the single release job (that
# touches the GitHub Release) elevates to contents: write.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------- test
  test:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — otherwise checkout writes a live
      # GITHUB_TOKEN into .git/config, where any code that runs later in this
      # directory (a build backend, a setup.py) can read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Verify vendored wheels
        run: ( cd wheels && sha256sum -c --quiet SHA256SUMS )
      # pyaes is sdist-only on PyPI, so the runtime closure is installed from
      # the vendored wheels with --no-index: nothing here can be swapped by
      # whoever next publishes to PyPI.
      - run: >-
          pip install --no-index --find-links wheels
          --require-hashes --only-binary :all: -r requirements-runtime.lock
      # Build/test tooling comes from PyPI but is hash-pinned too.
      - run: >-
          pip install --require-hashes --only-binary :all: -r requirements-build.lock
      # --no-build-isolation: the backend is the pinned setuptools installed
      # above, not one pip downloads and executes at this point.
      - run: pip install --no-build-isolation --no-deps -e . && python -m pytest -q

  # --------------------------------------------------------------------- deb
  deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job has the widest install base (every Debian/Ubuntu user), so it
      # must not build against whatever python ubuntu-latest happens to ship.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$VERSION" || { echo "bad tag version '$VERSION'"; exit 1; }
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/telegram_downloader/__init__.py
          grep -E "^version = \"$VERSION\"$" pyproject.toml
      # Archive members are otherwise stamped with wall-clock time, so two
      # builds of one commit disagree bit-for-bit and no published checksum
      # means anything. Bind it to the commit time.
      - name: Pin build timestamps
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - run: chmod +x scripts/build-deb.sh && ./scripts/build-deb.sh
      - name: Smoke test .deb contents
        run: |
          DEB=(dist/*.deb)
          [ "${#DEB[@]}" -eq 1 ] || { echo "expected exactly 1 .deb, found ${#DEB[@]}"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Depends
          dpkg-deb -c "$DEB" | grep -E "(usr/bin/tg-dl|opt/telegram-downloader)" | head -5
      # The .deb must be able to install itself with the network unplugged.
      # If the vendored wheel set is incomplete, run.sh would fall back to
      # PyPI at the end user's first launch — prove here that it cannot.
      - name: Prove the .deb installs offline
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/offline-probe"
          rm -rf "$WORK"; mkdir -p "$WORK"
          dpkg-deb -x dist/*.deb "$WORK/root"
          sed "s#^APP=/opt/telegram-downloader#APP=$WORK/root/opt/telegram-downloader#" \
            "$WORK/root/opt/telegram-downloader/run.sh" > "$WORK/run.sh"
          chmod +x "$WORK/run.sh"
          # Best isolation available: a network namespace with no interfaces.
          # Fall back to a dead proxy if the runner forbids user namespaces.
          if unshare -rn true 2>/dev/null; then
            ISOLATE=(unshare -rn)
          else
            export http_proxy=http://127.0.0.1:1 https_proxy=http://127.0.0.1:1 all_proxy=http://127.0.0.1:1
            ISOLATE=()
          fi
          "${ISOLATE[@]}" env HOME="$WORK/home" \
            XDG_DATA_HOME="$WORK/home/.local/share" "$WORK/run.sh" --version
          rm -rf "$WORK"
      # Checksums are generated in the `release` job, not here: this job both
      # produces the artifact and signs the statement about it, which binds the
      # checksum to nothing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: deb
          path: |
            dist/*.deb

  # --------------------------------------------------------------------- apk
  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$VERSION" || { echo "bad tag version '$VERSION'"; exit 1; }
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/telegram_downloader/__init__.py
          grep -E "^version = \"$VERSION\"$" pyproject.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "17" }
      - name: Pin build timestamps
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      # build-apk.sh installs Flet itself from requirements-flet.lock with
      # --require-hashes and refuses to run on an interpreter the lock does not
      # cover. Flet writes to build/apk; the script relocates it to dist/apk so
      # `build/` stays purely setuptools' staging area.
      - name: Detect signing secrets
        env:
          SIGN: ${{ inputs.sign }}
          K: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if [ "$SIGN" != "false" ] && [ -n "${K:-}" ]; then
            echo "HAS_APK_KEY=true" >> "$GITHUB_ENV"
          else
            echo "no APK upload key configured; shipping an unsigned .apk" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: chmod +x scripts/build-apk.sh && ./scripts/build-apk.sh
      - name: Rename APK to versioned release name
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ls -R dist
          APK=(dist/apk/*.apk)
          [ "${#APK[@]}" -eq 1 ] || { echo "expected exactly 1 APK, found ${#APK[@]}"; exit 1; }
          mv "$APK" "dist/apk/telegram-downloader_${VERSION}.apk"
          ls -la dist/apk/
      # Unsigned APKs are installable but Android shows no provenance at all.
      # Best-effort: skip cleanly on forks, which have no keystore.
      - name: Sign APK
        if: env.HAS_APK_KEY == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "using build-tools $(basename "$BT")"
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          APK=(dist/apk/*.apk)
          "$BT/zipalign" -p -f 4 "${APK[0]}" "${APK[0]}.aligned"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/upload.jks" \
            --ks-key-alias "$APK_KEY_ALIAS" \
            --ks-pass "env:APK_KEYSTORE_PASSWORD" \
            --key-pass "env:APK_KEY_PASSWORD" \
            --out "${APK[0]}" "${APK[0]}.aligned"
          rm -f "${APK[0]}.aligned" "$RUNNER_TEMP/upload.jks"
          "$BT/apksigner" verify --verbose --print-certs "${APK[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: apk
          path: |
            dist/apk/*.apk

  # --------------------------------------------------------------------- dmg
  dmg:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$VERSION" || { echo "bad tag version '$VERSION'"; exit 1; }
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i '' "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/telegram_downloader/__init__.py
          grep -E "^version = \"$VERSION\"$" pyproject.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Pin build timestamps
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      # create-dmg ships no release artifacts and `brew install create-dmg`
      # tracks whatever the formula says today, so the tool that builds the
      # .dmg was floating. Fetch one pinned commit and verify its bytes.
      - name: Install pinned create-dmg
        run: |
          set -euo pipefail
          CREATE_DMG_SHA=bb9ea3194e55f2f76a821e87541513748d0fedc69f45cf4f0951cad15ae0cae5
          CREATE_DMG_COMMIT=a2b71d0fda6d0df2a86dc7f67082d4d73e84c59f
          curl -fsSL "https://raw.githubusercontent.com/create-dmg/create-dmg/$CREATE_DMG_COMMIT/create-dmg" \
            -o "$RUNNER_TEMP/create-dmg"
          echo "$CREATE_DMG_SHA  $RUNNER_TEMP/create-dmg" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/create-dmg"
          sudo install -m 0755 "$RUNNER_TEMP/create-dmg" /usr/local/bin/create-dmg
          create-dmg --version || true
      - name: Detect signing secrets
        env:
          SIGN: ${{ inputs.sign }}
          CERT: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          NOTARIZE: ${{ inputs.notarize }}
          APPLE_ID_S: ${{ secrets.APPLE_ID }}
        run: |
          if [ "$SIGN" != "false" ] && [ -n "${CERT:-}" ]; then
            echo "HAS_CODESIGN=true" >> "$GITHUB_ENV"
          else
            echo "no Developer ID certificate; .dmg will be un-notarized" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$NOTARIZE" != "false" ] && [ -n "${APPLE_ID_S:-}" ]; then
            echo "HAS_NOTARY=true" >> "$GITHUB_ENV"
          fi
      # build-dmg.sh installs Flet from requirements-flet.lock with
      # --require-hashes; Flet's build/macos output is moved to dist/macos.
      - run: chmod +x scripts/build-dmg.sh && ./scripts/build-dmg.sh
      # An un-notarized .dmg is quarantined by Gatekeeper, which teaches users
      # to click through the OS's own integrity control — the one defence that
      # still works when the release account is compromised. Best-effort.
      - name: Codesign app bundle
        if: env.HAS_CODESIGN == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          APP=(dist/macos/*.app)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          printf '%s' "$CERT_P12_BASE64" | base64 -d --infile=- > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning | sed -n 's/.*"\(.*\)"/\1/p' | head -1)"
          test -n "$IDENTITY" || { echo "no codesigning identity in keychain"; exit 1; }
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "${APP[0]}"
          codesign --verify --deep --strict --verbose=2 "${APP[0]}"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Package versioned .dmg
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          APP=(dist/macos/*.app)
          test -d "${APP[0]}" || { echo "no .app bundle in dist/macos"; ls -R dist; exit 1; }
          create-dmg --volname "Telegram Downloader" \
            "dist/telegram-downloader_${VERSION}.dmg" "${APP[0]}"
          ls -la dist/
      - name: Notarize and staple .dmg
        if: env.HAS_NOTARY == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          DMG="dist/telegram-downloader_${VERSION}.dmg"
          xcrun notarytool store-credentials tgd-notary \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID"
          xcrun notarytool submit "$DMG" --keychain-profile tgd-notary --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: macos
          path: |
            dist/*.dmg

  # ----------------------------------------------------------------- release
  # Single release job: the three build jobs upload their artifacts; this job
  # downloads them, computes the checksums, and attaches everything to the tag
  # in ONE step. Previously each job called softprops/action-gh-release
  # concurrently, which raced on creating the release (422) and produced
  # duplicate release notes.
  release:
    needs: [deb, apk, dmg]
    # `always()` so a failed apk/dmg does NOT skip the whole release. The
    # .deb is the artifact the Linux in-app updater installs, and holding it
    # hostage to an unrelated upstream Flet/Flutter break (apk and dmg are
    # currently broken that way) means no release ships at all. The release
    # still requires deb to have SUCCEEDED -- a broken .deb must never be
    # published -- and the steps below verify whatever artifacts are present
    # and refuse to publish a partial or mismatched set.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.deb.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: deb, path: deb }
      - name: Report which platform builds failed
        run: |
          echo "deb:   ${{ needs.deb.result }}"
          echo "apk:   ${{ needs.apk.result }}"
          echo "dmg:   ${{ needs.dmg.result }}"
          if [ "${{ needs.apk.result }}" != "success" ] || [ "${{ needs.dmg.result }}" != "success" ]; then
            echo "::warning::apk/dmg did not build; publishing the .deb only. The updater installs only .deb on Linux, so this release is still usable."
          fi
      # apk/macos are optional: download-artifact fails when the producing job
      # did not upload anything, so these two are allowed to no-op.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with: { name: apk, path: apk }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with: { name: macos, path: macos }
      - name: Verify artifact names
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "release ${VERSION} contents:"
          ls -la deb apk macos 2>/dev/null || true
          # The .deb is REQUIRED -- it is what the Linux updater installs, and
          # a release without it would be useless to the primary audience.
          [ "$(ls deb/*.deb 2>/dev/null | wc -l)" -eq 1 ] || { echo "missing deb"; exit 1; }
          [ -f "deb/telegram-downloader_${VERSION}_amd64.deb" ] || { echo "unexpected deb filename"; ls -1 deb; exit 1; }
          # apk/dmg are OPTIONAL. When their build job failed nothing is
          # downloaded, and publishing the platforms that DID build is
          # correct. When an artifact IS present it must still be exactly one
          # correctly-named file -- a half-uploaded or misnamed artifact must
          # never be published, and the "exactly one" check catches the case
          # where a stale artifact got mixed in.
          if [ -d apk ]; then
            n="$(ls apk/*.apk 2>/dev/null | wc -l)"
            [ "$n" -eq 1 ] || { echo "apk dir present with $n artifacts (expected 0 or 1)"; ls -1 apk; exit 1; }
            [ -f "apk/telegram-downloader_${VERSION}.apk" ] || { echo "unexpected apk filename"; ls -1 apk; exit 1; }
          else
            echo "note: no apk artifact (build job failed); releasing .deb only"
          fi
          if [ -d macos ]; then
            n="$(ls macos/*.dmg 2>/dev/null | wc -l)"
            [ "$n" -eq 1 ] || { echo "macos dir present with $n artifacts (expected 0 or 1)"; ls -1 macos; exit 1; }
            [ -f "macos/telegram-downloader_${VERSION}.dmg" ] || { echo "unexpected dmg filename"; ls -1 macos; exit 1; }
          else
            echo "note: no dmg artifact (build job failed); releasing .deb only"
          fi
# Checksums are computed HERE, not in the jobs that built the artifacts.
      # This job has no checkout, no compiler and no source: it can only
      # download what the build jobs uploaded. A checksum produced by the same
      # process that produced the file proves nothing; this at least proves the
      # published bytes are the bytes that were uploaded. (The .dmg's checksum
      # used to have to be made on the macOS runner because stock macOS has no
      # sha256sum; the release job is linux, so all three are computed here.)
      - name: Verify the app can actually verify what we are about to sign
        # The updater was dead for weeks because CI signed with GPG (.asc)
        # while the app fetched Ed25519 (.sig) -- two independent breaks that
        # only surfaced at install time, on a user's machine. This step fails
        # the release HERE instead: the key in the secret must be present in
        # PINNED_RELEASE_SIGNING_KEYS, and a real signature must verify
        # through the app's own code.
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, subprocess, sys, tempfile, pathlib
          sys.path.insert(0, "src")
          from telegram_downloader import _release_verify as rv
          secret = os.environ.get("RELEASE_SIGNING_KEY", "")
          st = rv.validate_pinned_keys()
          if not secret and not st.ok:
              # No key anywhere: this is an unsigned release (fork builds, or
              # an operator who has not set signing up yet). That is a
              # legitimate state -- the app refuses to auto-install these,
              # which is the correct outcome, not a broken build.
              print("::notice::No signing key configured; publishing UNSIGNED. "
                    "The in-app updater will refuse to install it by design.")
              raise SystemExit(0)
          if not st.ok:
              raise SystemExit("release blocked: " + st.summary)
          print("pinned keyring OK:", st.summary)
          if not secret:
              print("no RELEASE_SIGNING_KEY secret; publishing unsigned")
              raise SystemExit(0)
          with tempfile.TemporaryDirectory() as td:
              key = pathlib.Path(td) / "k.pem"
              key.write_bytes(base64.b64decode(secret))
              key.chmod(0o600)
              der = subprocess.run(["openssl", "pkey", "-in", str(key),
                                    "-pubout", "-outform", "DER"],
                                   capture_output=True, check=True).stdout
              pub = base64.b64encode(der[-32:]).decode()
              signed = rv.key_id_for(der[-32:]) in {
                  rv.key_id_for(rv.decode_public_key(v))
                  for v in rv.PINNED_RELEASE_SIGNING_KEYS.values()}
              if not signed:
                  raise SystemExit(
                      "release blocked: the RELEASE_SIGNING_KEY secret's public "
                      "key is NOT pinned in _release_verify.py, so the app would "
                      "refuse every download from this release. Pin it, or unset "
                      "the secret to publish unsigned.")
              print("signing key matches a pinned public key")
          PY
      - name: Compute and sign checksum manifests
        env:
          SIGN: ${{ inputs.sign }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # Only compute a manifest for a platform whose artifact actually
          # exists. sha256sum on a missing glob would abort the step, and
          # publishing a SHA256SUMS-* with no installer beside it is worse
          # than publishing nothing for that platform.
          for plat in deb apk dmg; do
            case "$plat" in
              deb) dir=deb;   ext=deb ;;
              apk) dir=apk;   ext=apk ;;
              dmg) dir=macos; ext=dmg ;;   # the macOS artifact dir is "macos"
            esac
            [ -d "$dir" ] || { echo "skipping $plat (no artifact dir)"; continue; }
            # Match the platform's OWN extension only. Listing all three
            # patterns makes sha256sum exit non-zero on the two that do not
            # exist even though it writes the good line first, which under
            # `set -e` aborts the step.
            shopt -s nullglob
            files=( "$dir"/*."$ext" )
            shopt -u nullglob
            [ "${#files[@]}" -eq 1 ] || { echo "skipping $plat (${#files[@]} .$ext files, expected 1)"; continue; }
            ( cd "$dir" && sha256sum "${files[@]##*/}" > "SHA256SUMS-$plat" )
          done
          for f in deb/SHA256SUMS-deb apk/SHA256SUMS-apk macos/SHA256SUMS-dmg; do
            [ -f "$f" ] || continue
            echo "--- $f"; cat "$f"
            ( cd "$(dirname "$f")" && sha256sum -c "$(basename "$f")" )
          done
          if [ "$SIGN" != "false" ] && [ -n "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
            # The private key exists only in $RUNNER_TEMP for the length of
            # this step, under umask 077, and is removed by the EXIT trap even
            # if signing fails partway. It is never written to the workspace,
            # never echoed, and never committed.
            umask 077
            KEY="$RUNNER_TEMP/release-signing.pem"
            cleanup_key() { rm -f "$KEY"; }
            trap cleanup_key EXIT
            printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d > "$KEY"
            chmod 600 "$KEY"
            # An SPKI DER blob for Ed25519 is exactly 44 bytes: a 12-byte
            # header followed by the 32 raw public key bytes. The key id MUST
            # be derived exactly as _release_verify.key_id_for does, because
            # that is the value the app checks the envelope against:
            #   sha256(b"tgdl-release-key:" + raw32).hexdigest()[:8]
            KEYID="$(openssl pkey -in "$KEY" -pubout -outform DER | tail -c 32 \
              | python3 -c 'import hashlib,sys; print(hashlib.sha256(b"tgdl-release-key:"+sys.stdin.buffer.read()).hexdigest()[:8])')"
            echo "release signing key id: $KEYID"
            for f in deb/SHA256SUMS-deb apk/SHA256SUMS-apk macos/SHA256SUMS-dmg; do
              [ -f "$f" ] || { echo "no manifest for $f (platform not built)"; continue; }
              dir="$(dirname "$f")"
              base="$(basename "$f")"
              # -rawin = Ed25519 over the message itself (PureEdDSA), which is
              # what the app's pure-Python RFC 8032 verifier implements.
              openssl pkeyutl -sign -inkey "$KEY" -rawin \
                -in "$f" -out "$dir/$base.sig.raw"
              printf 'tgdl-ed25519-v1 %s %s\n' "$KEYID" \
                "$(base64 -w0 < "$dir/$base.sig.raw")" > "$dir/$base.sig"
              rm -f "$dir/$base.sig.raw"
            done
            # Fail the release loudly rather than shipping manifests the app
            # will refuse: a signed release that is missing a signature is
            # indistinguishable from an attack at install time. At least one
            # manifest MUST have been signed -- otherwise this release has no
            # trust anchor at all and is not worth publishing.
            signed_count=0
            for f in deb/SHA256SUMS-deb apk/SHA256SUMS-apk macos/SHA256SUMS-dmg; do
              [ -f "$f" ] || continue
              [ -f "$f.sig" ] || { echo "ERROR: $f has no signature"; exit 1; }
              ls -l "$f.sig"
              signed_count=$((signed_count + 1))
            done
            [ "$signed_count" -gt 0 ] || { echo "no manifests were signed; refusing to publish"; exit 1; }
          else
            echo "::warning::No RELEASE_SIGNING_KEY secret configured; checksum manifests published UNSIGNED. The in-app updater will refuse to install these (that is intentional, not a bug)."
            echo "no Ed25519 signing key configured; checksum manifests published unsigned" >> "$GITHUB_STEP_SUMMARY"
          fi
      # fail_on_unmatched_files must stay TRUE (a silently-dropped artifact is
      # worse than a failed release), so the list has to be exactly the files
      # that exist — the .asc manifests only exist when signing is on.
      - name: Collect release assets
        id: assets
        run: |
          {
            echo "assets<<EOF"
            for f in deb/*.deb deb/SHA256SUMS-deb deb/SHA256SUMS-deb.sig \
                     apk/*.apk apk/SHA256SUMS-apk apk/SHA256SUMS-apk.sig \
                     macos/*.dmg macos/SHA256SUMS-dmg macos/SHA256SUMS-dmg.sig; do
              [ -f "$f" ] && echo "$f"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "publishing:"; sed -n '/^assets<</,/^EOF$/p' "$GITHUB_OUTPUT"
      # Idempotency. `overwrite: true` replaces assets of the same name, but a
      # re-run that fails halfway leaves the release holding a mix of old and
      # new files. Delete every asset we are about to publish FIRST, so a
      # failure mid-attach leaves a release that is visibly incomplete rather
      # than quietly wrong.
      - name: Remove superseded release assets
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            existing="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            for f in deb/*.deb deb/SHA256SUMS-deb deb/SHA256SUMS-deb.sig \
                     apk/*.apk apk/SHA256SUMS-apk apk/SHA256SUMS-apk.sig \
                     macos/*.dmg macos/SHA256SUMS-dmg macos/SHA256SUMS-dmg.sig; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              if grep -Fxq "$name" <<<"$existing"; then
                echo "deleting existing asset $name"
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
              fi
            done
          else
            echo "no existing release for $GITHUB_REF_NAME"
          fi
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite: true
          files: ${{ steps.assets.outputs.assets }}
