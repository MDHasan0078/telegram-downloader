# requirements-build.lock — the PEP 517 build backend, pinned and hashed.
#
# Used with `--no-build-isolation`, which is what makes this file matter:
# WITHOUT it, `pip wheel .` creates a throwaway virtualenv, downloads
# setuptools from PyPI, and executes setuptools' setup.py inside the directory
# that actions/checkout has just written a live GITHUB_TOKEN into
# (.git/config). That turns "pip can resolve setuptools" into "anyone who can
# publish a setuptools can read the release token". With --no-build-isolation
# the backend is whatever this file pins, already installed, already verified.
#
# pyproject.toml still says `requires = ["setuptools>=68"]`; the pin here is
# what actually runs in CI. Bump both together.
#
# Regenerate (needs network):
#   pip download --only-binary :all: --dest /tmp/bt --no-deps setuptools wheel
#   for plat in manylinux2014_x86_64 macosx_11_0_arm64; do
#     pip download --only-binary :all: --dest /tmp/bt --no-deps \
#       --python-version 3.12 --implementation cp --abi cp312 --platform "$plat" \
#       setuptools wheel
#   done
setuptools==84.0.0 \
    --hash=sha256:51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670
wheel==0.48.0 \
