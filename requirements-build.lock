# PyYAML is the test tooling's YAML reader. It is here because
# scripts/check_workflow_inputs.py parses the workflow to check every action
# step's `with:` keys -- a reserved step key nested in there (an `env:`
# block, say) makes GitHub reject the WHOLE workflow, and the run then
# fails with zero jobs and a message that exists only in the web UI.
#
# PyYAML 6.0.3 ships no universal wheel, so the hash of every supported
# CPython's manylinux x86_64 wheel is listed. The sdist is deliberately
# NOT listed: --only-binary :all: must not silently build it.
