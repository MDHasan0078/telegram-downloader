# requirements-runtime.lock — HERMETIC runtime closure for the .deb.
#
# This file is the ONLY thing the end user's machine needs from the network:
# nothing. scripts/build-deb.sh vendors every wheel listed here into
# /opt/telegram-downloader/wheels/ and run.sh installs with
#     pip install --no-index --find-links "$APP/wheels" --require-hashes \
#                 --only-binary :all: --no-build-isolation \
#                 -r requirements-runtime.lock <project wheel>
# --no-index + --require-hashes + --only-binary together mean the install can
# neither reach PyPI nor build C from an sdist as an unprivileged user.
#
# Every hash below is the sha256 published by PyPI for that exact artifact
# (https://pypi.org/pypi/<name>/<version>/json), cross-checked against the
# bytes actually vendored in wheels/ and recorded in wheels/SHA256SUMS.
# There are two exceptions, both wheels this repo builds itself:
#   * pyaes — PyPI publishes an sdist only, so there is no wheel hash to use;
#   * msgpack — PyPI publishes per-ABI *binary* wheels only, and this repo
#     vendors a py3-none-any wheel built from their ABI-independent files.
#     See "--- msgpack is vendored as one pure-python wheel ---" below; the
#     builder is scripts/vendor_msgpack_purepython.py and is deterministic,
#     so the hash here is reproducible from the upstream wheels, not a guess.
#
# Closure: the `gui` extra only (flet) + the base dependency (telethon).
# The `speed` extra (cryptg) is deliberately NOT here — see the note at the
# bottom of this file.
#
# Regenerate (needs network; produces both this file and wheels/SHA256SUMS):
#   rm -rf wheels/*.whl && mkdir -p wheels
#   pip download --only-binary :all: --dest wheels \
#       --find-links <a dir containing pyaes-1.6.1-py3-none-any.whl> \
#       --python-version 3.12 --implementation cp --abi cp312 \
#       --platform manylinux2014_x86_64 \
#       'telethon>=1.36,<2' 'flet==0.86.5'
#   # ^ that one command no longer fetches msgpack: the resolver would pull the
#   #   cp312 binary wheel, which is not what ships. Get the upstream msgpack
#   #   wheels explicitly and re-derive the one wheel this package ships:
#   for v in 3.10 3.11 3.12 3.13 3.14; do
#     pip download --only-binary :all: --dest /tmp/mp --no-deps 'msgpack==1.2.3' \
#       --python-version "$v" --implementation cp --abi "cp${v/./}" \
#       --platform manylinux2014_x86_64
#   done
#   python3 scripts/vendor_msgpack_purepython.py wheels /tmp/mp
#   # ^ resolves markers against 3.12, so it SILENTLY SKIPS the one
#   #   version-conditional pin below. A 3.12-only regeneration therefore
#   #   reproduces a wheel set that is broken on 3.10 -- fetch that by hand:
#   pip download --only-binary :all: --dest wheels --no-deps \
#       'exceptiongroup==1.3.1'
#   ( cd wheels && sha256sum *.whl > SHA256SUMS )
#
# --- conditional pins -------------------------------------------------------
# `exceptiongroup` is the only version-conditional pin. anyio's METADATA asks
# for `exceptiongroup>=1.0.2; python_version < "3.11"`, and that is a real
# runtime import (anyio/_core/_exceptions.py), not just packaging metadata:
# ExceptionGroup/ExceptionGroup.__new__ only exist in the stdlib from 3.11, so
# on 3.10 an install without this wheel dies on first import.
#
# The marker keeps 3.11+ installs byte-identical to what they were before,
# while making the 3.10/3.11 leg of the closure explicit rather than implied.
#
# These markers are the reason the pins above cannot be trusted by eye: the
# supported range is 3.10..3.14 and the build (and CI) runs on 3.12, where
# every `python_version < "3.11"` marker evaluates False. The closure walk in
# scripts/build-deb.sh re-evaluates every vendored wheel's Requires-Dist for
# each interpreter in that whole range and fails the build on an unresolvable
# one, so a pin like this can never silently go missing again.
#
# NOTE: that walk is NOT `pip install --python-version`, which only re-tags
# wheels. Markers in the requirement itself are still evaluated against the
# interpreter running pip, so pip happily resolves a 3.10 install with
# exceptiongroup deleted from the lock. The walk in build-deb.sh evaluates the
# markers itself, per interpreter, which is the only thing that catches it.
#
# --- msgpack is vendored as one pure-python wheel --------------------------
# msgpack is a C extension, so PyPI ships one wheel per CPython ABI and the
# .deb used to vendor all five of cp310..cp314: 2,340,054 bytes, HALF the
# package, for a library that is only ever imported by `flet` and used by
# exactly one of the copies. Narrowing the range instead would have cost
# Ubuntu 22.04 (3.10) or Debian 12 (3.11) real users — every minor version in
# 3.10..3.14 is some currently-supported Debian/Ubuntu release's system
# python3 — so that is a regression, not a trade.
#
# Instead: every one of those five wheels already carries msgpack's own
# pure-python implementation (msgpack/fallback.py, 33 KB) alongside a 1.5 MB
# unstripped `.so` of which ~1.3 MB is DWARF debug info, and __init__.py picks
# between them:
#
#     if os.environ.get("MSGPACK_PUREPYTHON"):
#         from .fallback import Packer, Unpacker, unpackb
#     else:
#         try:
#             from ._cmsgpack import Packer, Unpacker, unpackb
#         except ImportError:
#             from .fallback import Packer, Unpacker, unpackb
#
# scripts/vendor_msgpack_purepython.py builds the wheel from the files all five
# wheels agree on byte-for-byte, minus the `.so`: 15,486 bytes, py3-none-any,
# installs unchanged on 3.10 through 3.14. flet only uses packb(), unpackb()
# and ExtType, all of which fallback.py implements identically; a 12-control
# flet screen round-trips to byte-identical output on both, and the fallback
# still does ~850 such messages/second single-threaded (the C extension: ~3,650).
# scripts/build-deb.sh re-checks the shape of this wheel on every build so it
# cannot silently rot back into a binary one.
#
# --- why `speed`/cryptg is dropped ---------------------------------------
# cryptg is an optional Telethon C acceleration module. Telethon works
# correctly without it (it falls back to pure-python crypto). Worse, cryptg
# is sdist-only for CPython, so `pip install "telegram-downloader[speed]"`
# on Alpine/Termux/musl compiles C in the end user's unprivileged venv —
# which needs a compiler the user may not have and, more importantly, means
# running a build backend that pip fetched at that moment. Dropping it removes
# an entire unpinned build-from-source path from the user's first launch.
