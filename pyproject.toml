[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-downloader"
version = "1.3.0"
description = "Telegram media downloader — persistent login, resumable downloads, queue, GUI + CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "telegram-downloader" }]
keywords = ["telegram", "downloader", "telethon", "media"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Multimedia :: Video",
  "Operating System :: OS Independent",
]
dependencies = [
  # EXACT pin, not a range, and the reason is specific to how the mobile and
  # desktop artifacts are built. `flet build apk` / `flet build macos` do not
  # run pip over this project: they hand this list verbatim to serious_python,
  # which spawns `pip install --upgrade --only-binary :all: ... <this list>`
  # against PyPI with no --require-hashes. A range therefore means one tag can
  # ship telethon 1.45.0 inside the .deb (pinned by requirements-runtime.lock +
  # wheels/) and telethon 1.46.0 inside the .apk/.dmg, resolved at build time
  # from whoever published that release first.
  #
  # An exact `==` still leaves the download unverified -- only a serious_python
  # change can close that -- but it removes the version drift, which is the part
  # that silently made the three artifacts disagree. scripts/build-apk.sh and
  # scripts/build-dmg.sh assert that this pin equals the one in
  # requirements-runtime.lock and the one vendored in wheels/, so it cannot go
  # stale unnoticed. Bump it here, there and in wheels/ together.
  "telethon==1.45.0",
]

[project.optional-dependencies]
gui = ["flet==0.86.5"]
speed = ["cryptg>=0.4.0,<2"]
# NB: no 'rich'/'tqdm' extras — nothing imports them (verified). Keeping the
# extra would only attract misreported missing-dependency bugs.
all = ["flet==0.86.5", "cryptg>=0.4.0,<2"]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
tg-dl = "telegram_downloader.cli:main"

[project.urls]
Homepage = "https://github.com/MDHasan0078/telegram-downloader"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.flet]
# Used by `flet build` for .apk / .dmg / .msix targets.
# See scripts/build-*.sh for wrapper commands.
project_name = "Telegram Downloader"
product_name = "Telegram Downloader"
org = "com.tgdownloader"
company = "tgdownloader"
