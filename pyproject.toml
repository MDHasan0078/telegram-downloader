[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-downloader"
version = "1.3.4"
description = "Telegram media downloader — persistent login, resumable downloads, queue, GUI + CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "telegram-downloader" }]
keywords = ["telegram", "downloader", "telethon", "media"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Multimedia :: Video",
  "Operating System :: OS Independent",
]
dependencies = [
  # EXACT pin, not a range, and the reason is specific to how the mobile and
  # desktop artifacts are built. `flet build apk` / `flet build macos` do not
  # run pip over this project: they hand this list verbatim to serious_python,
  # which spawns `pip install --upgrade --only-binary :all: ... <this list>`
  # against PyPI with no --require-hashes. A range therefore means one tag can
  # ship telethon 1.45.0 inside the .deb (pinned by requirements-runtime.lock +
  # wheels/) and telethon 1.46.0 inside the .apk/.dmg, resolved at build time
  # from whoever published that release first.
  #
  # An exact `==` still leaves the download unverified -- only a serious_python
  # change can close that -- but it removes the version drift, which is the part
  # that silently made the three artifacts disagree. scripts/build-apk.sh and
  # scripts/build-dmg.sh assert that this pin equals the one in
  # requirements-runtime.lock and the one vendored in wheels/, so it cannot go
  # stale unnoticed. Bump it here, there and in wheels/ together.
  "telethon==1.45.0",
]

[project.optional-dependencies]
gui = ["flet==0.86.5"]
speed = ["cryptg>=0.4.0,<2"]
# NB: no 'rich'/'tqdm' extras — nothing imports them (verified). Keeping the
# extra would only attract misreported missing-dependency bugs.
all = ["flet==0.86.5", "cryptg>=0.4.0,<2"]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
tg-dl = "telegram_downloader.cli:main"

[project.urls]
Homepage = "https://github.com/MDHasan0078/telegram-downloader"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the app logo with the package so every install -- editable,
# wheel, or the .deb's Python environment -- renders the same mark
# in the GUI title bar rather than a fallback.
[tool.setuptools.package-data]
"telegram_downloader" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.flet]
# Used by `flet build` for .apk / .dmg / .msix targets.
# See scripts/build-*.sh for wrapper commands.
project_name = "Telegram Downloader"
product_name = "Telegram Downloader"
org = "com.tgdownloader"
company = "tgdownloader"

# Merged into the generated Flutter project's pubspec.yaml by `flet build`
# (flet_cli/commands/build_base.py, "tool.flet.flutter.pubspec").
#
# jni is pinned HERE, not in Flet's template, because the template's pin is
# stale and the .apk build cannot compile against it any more:
#
#   Flet's Flutter template was published 2026-08-01, when the only jni on
#   pub.dev was 1.0.x, so it pins jni 1.0.0. Since then jni 1.1.0 landed
#   (2026-10-01) and the packages that generate JNI bindings moved with it:
#   jni_flutter 1.0.4+1 (2026-10-06) and shared_preferences_android 2.5.1
#   (2026-10-19) both declare jni ^1.1.0. Their generated bindings carry a
#   compile-time const assertion -- `const _$jniVersionCheck =
#   JniVersionCheck(1, 1)` -- which fails to evaluate when jni 1.0.x is
#   imported, so the Dart compile dies with:
#
#     generated bindings expect package:jni ^1.1.0, but 1.0.x was imported
#     Target kernel_snapshot_program failed
#
# The override in this file REPLACES the template's, because flet merges it
# with `pubspec.setdefault("dependency_overrides", {}).update(...)` -- the
# last writer for a key wins, and this is the last writer.
#
# jni 1.1.0 resolves on the runner's Dart (>= 3.12.0): package_config 3.0.0
# needs ^3.11.0, collection 1.19.1 needs ^3.4.0, jni_util 1.0.0 and ffi
# 2.1.3 need >= 3.3.0. If a future jni release moves the bindings again,
# this pin has to move with them -- and the failure will look exactly like
# the one above.
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"

# Per-platform pip dependencies for `flet build` (flet_cli reads
# `tool.flet.<platform>.dependencies` and appends them to the list it hands
# serious_python, which installs them into the artifact's Python closure).
#
# flet is an EXTRA here, and extras are not what `flet build` resolves: it
# installs `[project].dependencies`, which is telethon alone. So the published
# APK shipped a Python runtime with pyaes, pyasn1, rsa and telethon in it and
# NO flet -- and gui.py's `import flet` therefore died on the first line of
# the Android app, which the Flutter side renders as a red error screen.
#
# The .deb never had this problem: its runtime lock is the `gui` extra plus
# telethon, so flet is present. This is the APK's half of the same closure.
#
# The list form is required: flet_cli reads the value and iterates it as a
# list of requirement strings. A mapping here is iterated as its KEYS, which
# silently drops the version pin and leaves a bare "flet".
[tool.flet.android]
dependencies = ["flet==0.86.5"]

